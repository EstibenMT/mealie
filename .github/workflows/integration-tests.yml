name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Matching the project's pyproject.toml requirement

    - name: Install uv
      run: |
        pip install uv

    - name: Install python-ldap dependency
      run: |
        uv pip install python-ldap

    - name: Install dependencies
      run: |
        uv sync --extra pgsql --group dev # As seen in Taskfile.yml setup:py

    - name: Run Integration Tests
      run: |
        uv run pytest tests/integration_tests/
